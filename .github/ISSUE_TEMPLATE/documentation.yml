name: Documentation
description: Report a documentation gap or suggest an improvement
title: '[Docs]: '
labels: ['documentation']
body:
  - type: markdown
    attributes:
      value: |
        Help us improve our documentation. Describe what is missing, unclear, or incorrect.

  - type: textarea
    id: gap
    attributes:
      label: Documentation Gap
      description: What is missing, unclear, or incorrect?
      placeholder: Describe the documentation issue...
    validations:
      required: true

  - type: input
    id: affected-paths
    attributes:
      label: Affected Paths
      description: File or directory paths related to this issue.
      placeholder: 'e.g., docs/onboarding/README.md'
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Proposed Improvement
      description: How should the documentation be updated?
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of Change
      options:
        - Correction — fix inaccurate information
        - Clarification — improve readability or structure
        - Addition — new content needed
        - Deprecation — remove outdated content
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links to related docs, ADRs, or external references.
