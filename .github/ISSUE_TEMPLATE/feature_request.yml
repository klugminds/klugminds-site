name: Feature Request
description: Propose a new capability or significant improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who is affected?
      placeholder: Describe the problem or opportunity...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you have considered and why they were not chosen.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the repository does this affect?
      options:
        - Documentation
        - Architecture
        - Engineering Standards
        - Security
        - Operations
        - Product
        - Governance
        - Tooling / Scripts
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links, mockups, references, or related issues.
